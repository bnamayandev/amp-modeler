# Throwaway: reproduce the intermittent segfault pluginval hits on Linux after
# printing SUCCESS, and print a backtrace from its core dump. Not for merging.
name: Diagnose pluginval crash

on: push

jobs:
  pluginval-loop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb gdb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev libjack-jackd2-dev libcurl4-openssl-dev

      - name: Build everything, Release with symbols
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-g -DCMAKE_C_FLAGS=-g
          cmake --build build --config Release --parallel 4

      # The same steps CI runs before pluginval, in the same job, so the plugin
      # sees whatever they leave behind.
      - name: Unit tests and benchmark, as CI runs them
        shell: bash
        run: |
          touch "$RUNNER_TEMP/marker"
          xvfb-run -a build/tests/evil_tests_artefacts/Release/evil_tests "~[cpu]" | tail -3
          build/evil-cli_artefacts/Release/evil-cli bench --seconds 60 --block 128 --rate 48000 | tail -2
          build/evil-cli_artefacts/Release/evil-cli bench --seconds 60 --block 128 --rate 44100 | tail -2
          echo "::group::files written under HOME"
          find "$HOME" -newer "$RUNNER_TEMP/marker" -type f -not -path "*/work/*" 2>/dev/null | head -100
          echo "::endgroup::"

      # The check proposed for ci.yml, run 30 times. Each crash is also checked
      # against a frame that isn't there, which must be rejected.
      - name: Proposed CI check, 30 times
        shell: bash
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip"
          unzip -q pluginval.zip
          pluginval=./pluginval
          vst3="build/EvilAmplifier_artefacts/Release/VST3/Evil Amplifier.vst3"
          # check <pluginval exit code> <frame to accept>: exit status 0 = CI would pass
          check() {
            local code=$1 frame=$2
            [ "$code" -eq 0 ] && return 0
            grep -qx "SUCCESS" pluginval.log || return "$code"
            shopt -s nullglob; local cores=(cores/core.*); shopt -u nullglob
            [ ${#cores[@]} -eq 1 ] || { echo "expected one core, found ${#cores[@]}"; return "$code"; }
            local frames
            frames=$(gdb -q -batch -ex "bt 3" "$pluginval" "${cores[0]}" 2>/dev/null | grep "^#")
            echo "$frames" | cut -c1-160
            grep -q "$frame" <<<"$frames" || return "$code"
            echo "accepted: pluginval passed, then crashed on exit in its own VST3 RunLoop"
          }
          passed=0 accepted=0 failed=0 wrongly_accepted=0
          for i in $(seq 1 30); do
            rm -rf cores; mkdir -p cores
            ulimit -c unlimited
            sudo sysctl -q -w kernel.core_pattern="$PWD/cores/core.%e.%p"
            set +e
            xvfb-run -a "$pluginval" --strictness-level 10 --validate-in-process "$vst3" > pluginval.log 2>&1
            code=$?
            set -e
            if [ $code -eq 0 ]; then passed=$((passed + 1)); echo "run $i: pass"; continue; fi
            echo "run $i: exit $code"
            if check $code "RunLoop::Impl::registerEventHandler"; then accepted=$((accepted + 1)); else failed=$((failed + 1)); tail -5 pluginval.log; fi
            if check $code "NoSuchFrame::thatIsNotThere" > /dev/null; then wrongly_accepted=$((wrongly_accepted + 1)); fi
          done
          echo "RESULT: $passed passed, $accepted accepted host crashes, $failed failed, $wrongly_accepted wrongly accepted (must be 0)"
